name: Daily Commons Metrics Update

on:
  schedule:
    # Run every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update Contributor Upload Metrics
        run: |
          python3 scripts/fetch_metrics.py --update-all

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributors_india.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update live Commons upload counts [skip ci]" && git push)
